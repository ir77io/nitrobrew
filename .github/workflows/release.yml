name: Release

# Push a version tag (for example v1.0.0) to build the pkg and attach it to a GitHub Release.
# Run it by hand from the Actions tab to just build the pkg and download it as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  build-pkg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      # Fail fast, before the build: the tag must name the version in project.yml and the changelog.
      - name: Check the tag, the version and the changelog agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' src/project.yml | head -1)
          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION ($FILE_VERSION) in src/project.yml."
            echo "Bump the version and regenerate the project, or push a matching tag."
            exit 1
          fi
          ./scripts/changelog_notes.sh "$TAG_VERSION" > build-notes.md

      # Unsigned for now: the app is ad-hoc signed and the pkg is unsigned.
      # To sign and notarize later, import your Developer ID certificates into a temporary
      # keychain here and export APP_IDENTITY, PKG_IDENTITY and NOTARY_PROFILE before this step.
      - name: Build pkg
        run: ./scripts/build_pkg.sh

      # The final truth: the version inside the built app must match the tag too.
      - name: Check the built version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(ls build/*.pkg)
          EXPECTED="NitroBrew-${GITHUB_REF_NAME#v}.pkg"
          if [[ "$(basename "$PKG")" != "$EXPECTED" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the built version ($(basename "$PKG"))."
            echo "Regenerate the Xcode project after bumping MARKETING_VERSION, or push a matching tag."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NitroBrew-pkg
          path: build/*.pkg

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.pkg --title "NitroBrew ${GITHUB_REF_NAME#v}" --notes-file build-notes.md
